name: CIOB GMAO Nexus — Quality Gates & CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-gates:
    name: Typecheck, Lint, Audit, Unit Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check (Client & Shared Domain)
        run: npm run typecheck

      - name: TypeScript Check (Express LAN Server)
        run: npm run typecheck:server

      - name: TypeScript Strict Check (STRICT-P1)
        run: npm run typecheck:strict

      - name: ESLint Static Analysis (JS + TypeScript)
        run: npm run lint

      - name: Dependency Security Audit (High / Critical Gate)
        run: npm audit --audit-level=high

      - name: Unit & Integration Tests (Vitest)
        run: npm test

      - name: Production Bundle Build (Vite)
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gmao-production-dist
          path: dist/
          retention-days: 7

  # E2E-P2: Blocking Playwright E2E Critical Paths & Full Factory Cycle Gate
  e2e-playwright:
    name: Playwright E2E Critical Paths (Blocking Gate)
    runs-on: ubuntu-latest
    needs: quality-gates

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Suite
        run: npm run test:e2e

      - name: Upload Playwright Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: playwright-report/
          retention-days: 7
