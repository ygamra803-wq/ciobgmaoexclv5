name: Release & GitHub Tag Pipeline

on:
  push:
    tags:
      - 'ciobGMAO-nexusV*'
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  verify-and-release:
    name: Validate Version, Test, Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Tag Matches package.json & appVersion.ts
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG_NAME#ciobGMAO-nexusV}"
          TAG_VERSION="${TAG_VERSION#v}"
          PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "Git tag: ${TAG_NAME} (extracted version: ${TAG_VERSION})"
          echo "package.json version: ${PKG_VERSION}"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag version (${TAG_VERSION}) does not match package.json (${PKG_VERSION})."
            exit 1
          fi

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint Verification
        run: npm run lint

      - name: Run Full Test Suite (Vitest)
        run: npm test

      - name: Build Production Bundle
        run: npm run build

      - name: Package Release Archives
        shell: bash
        run: |
          mkdir -p release-artifacts
          tar -czf "release-artifacts/${GITHUB_REF_NAME}-dist.tar.gz" dist/
          zip -rq "release-artifacts/${GITHUB_REF_NAME}-dist.zip" dist/
          sha256sum release-artifacts/* > release-artifacts/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "CIOB GMAO Nexus ${GITHUB_REF_NAME}"
          generate_release_notes: true
          files: |
            release-artifacts/*
          prerelease: ${{ contains(github.ref_name, '-') }}
