<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gmaoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#064e3b" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#gmaoGrad)" />
  
  <!-- Inner Subtle Accent Border -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Central Excel & Industry Emblem -->
  <g transform="translate(106, 106)" filter="url(#shadow)">
    <!-- Sheet / Card Base -->
    <rect x="0" y="0" width="300" height="300" rx="40" fill="#ffffff" />
    
    <!-- Excel Header Bar -->
    <path d="M 0 40 C 0 17.9 17.9 0 40 0 L 260 0 C 282.1 0 300 17.9 300 40 L 300 80 L 0 80 Z" fill="#047857" />
    
    <!-- Table Grid Lines -->
    <line x1="100" y1="80" x2="100" y2="300" stroke="#e2e8f0" stroke-width="6" />
    <line x1="200" y1="80" x2="200" y2="300" stroke="#e2e8f0" stroke-width="6" />
    <line x1="0" y1="150" x2="300" y2="150" stroke="#e2e8f0" stroke-width="6" />
    <line x1="0" y1="225" x2="300" y2="225" stroke="#e2e8f0" stroke-width="6" />
    
    <!-- Bold 'X' / 'GMAO' Emblem Badge -->
    <circle cx="90" cy="190" r="54" fill="#059669" />
    <text x="90" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle">X</text>
    
    <!-- Data Bar Accents (Simulating Twin Stock Levels) -->
    <rect x="170" y="112" width="95" height="16" rx="8" fill="#10b981" />
    <rect x="170" y="178" width="75" height="16" rx="8" fill="#3b82f6" />
    <rect x="170" y="250" width="105" height="16" rx="8" fill="#f59e0b" />
    
    <!-- Small GMAO Pill -->
    <rect x="30" y="24" width="240" height="32" rx="16" fill="#065f46" />
    <text x="150" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ecfdf5" text-anchor="middle" letter-spacing="2">CIOB GMAO LIGHT</text>
  </g>
</svg>
