<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIOB GMAO Light UI Excel</title>
  <meta name="description" content="Application CIOB GMAO Light UI Excel avec Twin Tables, recalcul dynamique des formules Excel en temps réel et compatibilité 100% Offline">
  <meta property="og:title" content="CIOB GMAO Light UI Excel">
  <meta property="og:description" content="Application CIOB GMAO Light UI Excel avec Twin Tables, recalcul dynamique des formules Excel en temps réel et compatibilité 100% Offline">
  <meta name="theme-color" content="#047857">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CIOB GMAO">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://api.dicebear.com; connect-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=supervisor_account" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <style>
    *,:after,:before{box-sizing:border-box}
    html, body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      letter-spacing: -0.012em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: -0.02em;
    }
    .scrollbar-none::-webkit-scrollbar,
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none,
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.985); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes viewFadeSlide {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-view-transition {
      animation: viewFadeSlide 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes shimmerWave {
      0% {
        background-position: -200% 0;
      }
      100% {
        background-position: 200% 0;
      }
    }
    .shimmer-wave {
      background: linear-gradient(
        90deg,
        rgba(226, 232, 240, 0.7) 0%,
        rgba(241, 245, 249, 0.9) 35%,
        rgba(255, 255, 255, 0.98) 50%,
        rgba(241, 245, 249, 0.9) 65%,
        rgba(226, 232, 240, 0.7) 100%
      );
      background-size: 200% 100%;
      animation: shimmerWave 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .shimmer-wave-muted {
      background: linear-gradient(
        90deg,
        rgba(241, 245, 249, 0.8) 0%,
        rgba(248, 250, 252, 0.95) 50%,
        rgba(241, 245, 249, 0.8) 100%
      );
      background-size: 200% 100%;
      animation: shimmerWave 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .shimmer-wave-dark {
      background: linear-gradient(
        90deg,
        rgba(203, 213, 225, 0.8) 0%,
        rgba(226, 232, 240, 0.95) 50%,
        rgba(203, 213, 225, 0.8) 100%
      );
      background-size: 200% 100%;
      animation: shimmerWave 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    /* Fallback alias classes for monochromatic purity */
    .shimmer-wave-cyan,
    .shimmer-wave-emerald,
    .shimmer-wave-blue,
    .shimmer-wave-indigo,
    .shimmer-wave-amber,
    .shimmer-wave-rose,
    .shimmer-wave-purple {
      background: linear-gradient(
        90deg,
        rgba(226, 232, 240, 0.7) 0%,
        rgba(241, 245, 249, 0.9) 35%,
        rgba(255, 255, 255, 0.98) 50%,
        rgba(241, 245, 249, 0.9) 65%,
        rgba(226, 232, 240, 0.7) 100%
      );
      background-size: 200% 100%;
      animation: shimmerWave 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen selection:bg-emerald-100 selection:text-emerald-900">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
