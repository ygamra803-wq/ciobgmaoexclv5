  <script>
    (function() {
      try {
        var theme = localStorage.getItem('gmao_theme') || 'light';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        var accent = localStorage.getItem('gmao_accent_color') || 'emerald';
        document.documentElement.setAttribute('data-accent', accent);
        var density = localStorage.getItem('gmao_density') || 'comfortable';
        document.documentElement.setAttribute('data-density', density);
        var deviceMode = localStorage.getItem('gmao_device_mode') || 'auto';
        document.documentElement.setAttribute('data-device-mode', deviceMode);
        var sidebarStyle = localStorage.getItem('gmao_sidebar_style') || 'floating';
        document.documentElement.setAttribute('data-sidebar-style', sidebarStyle);
      } catch (e) {}

      // Load Google Fonts non-blockingly so external font latency never stalls first paint
      (function() {
        try {
          var fontUrls = [
            'https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=supervisor_account',
            'https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap'
          ];
          fontUrls.forEach(function(href) {
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = href;
            link.media = 'print';
            link.onload = function() { link.media = 'all'; };
            document.head.appendChild(link);
          });
        } catch (e) {}
      })();

      // Emergency recovery helper: only invoked if module loading fails or times out
      function healAndRetryOnce(paramName) {
        try {
          if (window.__GMAO_BOOTED__ || window.location.search.indexOf(paramName + '=') !== -1) {
            return;
          }
          var tasks = [];
          if ('caches' in window && window.caches) {
            tasks.push(
              window.caches.keys().then(function(keys) {
                return Promise.all((keys || []).map(function(k) { return window.caches.delete(k); }));
              }).catch(function() {})
            );
          }
          if ('serviceWorker' in navigator && navigator.serviceWorker) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                return Promise.all((regs || []).map(function(r) { return r.unregister(); }));
              }).catch(function() {})
            );
          }
          Promise.all(tasks).finally(function() {
            if (!window.__GMAO_BOOTED__) {
              var retryUrl = new URL(window.location.href);
              retryUrl.searchParams.set(paramName, String(Date.now()));
              window.location.replace(retryUrl.toString());
            }
          });
        } catch (e) {}
      }

      // Boot watchdog 1: if a root <script> tag fails to load (e.g. stale SW cached old asset hash), heal & retry once
      window.addEventListener('error', function(ev) {
        try {
          var target = ev && ev.target;
          if (target && target.tagName === 'SCRIPT' && !window.__GMAO_BOOTED__) {
            healAndRetryOnce('__mod_retry');
          }
        } catch (e) {}
      }, true);

      // Boot watchdog 2: if app still hasn't booted after 8s due to a stale service worker or deadlocked chunk, heal & retry once
      setTimeout(function() {
        if (!window.__GMAO_BOOTED__) {
          healAndRetryOnce('__sw_healed');
        }
      }, 8000);
    })();
  </script>

    }
    .animate-fadeIn {

    }
    @keyframes viewFadeSlide {

    .animate-view-transition {

    }
    @keyframes shimmerWave {
      0% {
        background-position: -200% 0;
      }
      100% {
        background-position: 200% 0;
      }
    }
    .shimmer-wave {
      background: linear-gradient(

        rgba(241, 245, 249, 0.9) 35%,
        rgba(255, 255, 255, 0.98) 50%,

      background-size: 200% 100%;
      animation: shimmerWave 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .shimmer-wave-muted {

      );
      background-size: 200% 100%;

    }
    .shimmer-wave-dark {

      );

      animation: shimmerWave 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;

    /* Fallback alias classes for monochromatic purity */
